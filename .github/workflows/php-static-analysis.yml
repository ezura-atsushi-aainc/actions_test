name: PHP Static Analysis

on:
  pull_request:
    paths:
      - 'app/**/*.php'

jobs:
  php-cs-fixer:
    name: PHP CS Fixer autofix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Composer install
        run: composer install --prefer-dist --no-progress

      - name: Get changed files in PR
        id: files
        run: |
          # list only .php files under app/ in the PR diff
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^app/.*\.php$' > changed_files.txt || true

      - name: Run PHP CS Fixer
        if: |
          steps.files.outputs.files != ''
        run: |
          if [ -s changed_files.txt ]; then
            xargs vendor/bin/php-cs-fixer fix --using-cache=no < changed_files.txt
          else
            echo "No PHP files to fix!"
          fi

      - name: Commit changes if there are any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: apply php-cs-fixer auto fixes"
          file_pattern: |
            app/**/*.php

  phpmd:
    name: PHP Mess Detector (phpmd) with reviewdog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Composer install
        run: composer install --prefer-dist --no-progress

      - name: Get changed files in PR
        id: files
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^app/.*\.php$' > changed_files.txt || true

      - name: Run phpmd with reviewdog
        run: |
          if [ -s changed_files.txt ]; then
            npx -y reviewdog@latest -reporter=github-pr-review \
              -name="phpmd" \
              -efm="%f:%l\t%m" \
              --filter-mode=diff_context \
              --fail-on-error=false \
              --diff="git diff origin/${{ github.base_ref }}" \
              -- tee >(xargs -I{} vendor/bin/phpmd {} text ./phpmd.xml)
          else
            echo "No PHP files to lint!"
          fi

        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
