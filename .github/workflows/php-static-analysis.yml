name: PHP Static Analysis

on:
  pull_request:
    paths:
      - 'app/**/*.php'
      - 'tests/**/*.php'

jobs:
  php-cs-fixer:
    if: startsWith(github.head_ref, 'feature/')
    name: PHP CS Fixer autofix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.3"
      - name: Download php-cs-fixer.phar
        run: |
          curl -L https://cs.symfony.com/download/php-cs-fixer-v3.phar -o php-cs-fixer.phar
          chmod +x php-cs-fixer.phar
      - name: Get changed files in PR
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^app/.*\.php$|^tests/.*\.php$' > changed_files.txt || true
      - name: Run PHP CS Fixer (custom config) on changed files
        run: |
          if [ -s changed_files.txt ]; then
            xargs -a changed_files.txt php php-cs-fixer.phar fix --using-cache=no --config=.php-cs-fixer.php
          else
            echo "No PHP files to fix!"
          fi
      - name: Commit changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: apply php-cs-fixer auto fixes"
          file_pattern: |
            app/**/*.php
            tests/**/*.php

  phpmd:
    if: startsWith(github.head_ref, 'feature/')
    name: PHP Mess Detector (phpmd) with reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.3"
      - name: Download phpmd.phar
        run: |
          curl -L https://phpmd.org/static/latest/phpmd.phar -o phpmd.phar
          chmod +x phpmd.phar
      - name: Install reviewdog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b . latest
      - name: Get changed files in PR
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^app/.*\.php$|^tests/.*\.php$' > changed_files.txt || true
      - name: Run phpmd (custom config) with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s changed_files.txt ]; then
            while read file; do
              php phpmd.phar "$file" text phpmd.xml || true
            done < changed_files.txt > phpmd-result.txt
            cat phpmd-result.txt | ./reviewdog -efm="%f:%l\t%m" -name="phpmd" -reporter=github-pr-review -fail-on-error=false
          else
            echo "No PHP files to lint!"
          fi

  phpstan:
    if: startsWith(github.head_ref, 'feature/')
    name: PHPStan (Static Analysis) with reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.3"
      - name: Download phpstan.phar
        run: |
          curl -L https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar -o phpstan.phar
          chmod +x phpstan.phar
      - name: Install reviewdog
        run: |
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b . latest
      - name: Get changed files in PR
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^app/.*\.php$|^tests/.*\.php$' > changed_files.txt || true
      - name: Run phpstan with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s changed_files.txt ]; then
            php phpstan.phar analyse --error-format=raw -l max --no-progress $(cat changed_files.txt) > phpstan-result.txt || true
            cat phpstan-result.txt | ./reviewdog -efm="%f:%l:%m" -name="phpstan" -reporter=github-pr-review -fail-on-error=false
          else
            echo "No PHP files to analyse!"
          fi
